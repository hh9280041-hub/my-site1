<style>
html{background:#03040a}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;font-family:Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4f4f5;overflow-x:hidden}
#gal,#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
#stars{z-index:-1;pointer-events:none}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(24px) saturate(115%);-webkit-backdrop-filter:blur(24px) saturate(115%);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 70px -10px rgba(210,220,255,.16),inset 0 1px 0 rgba(255,255,255,.14)}
.glass-sm{background:rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);transition:all .3s ease}
.link:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28);transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(255,255,255,.35)}
.dot{animation:statusPulse 2s infinite}
@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
.eq span{display:block;width:4px;height:4px;border-radius:2px;background:linear-gradient(#fff,#9ca3af);transition:height .08s linear}
a:focus-visible,button:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.link:hover{transform:none}}
</style>

<script>
// Discord: счётчик секунд (момент последнего визита хранится в localStorage)
let seen;
try { seen = +localStorage.getItem('seenDiscord') || Date.now(); localStorage.setItem('seenDiscord', seen); }
catch (e) { seen = Date.now(); }
const secEl = document.getElementById('sec');
const tick = () => { secEl.textContent = Math.floor((Date.now() - seen) / 1000).toLocaleString('ru-RU'); };
tick(); setInterval(tick, 1000);

// Фон: галактика M31. Если рядом с файлом лежит andromeda.jpg, она заменит процедурную картинку.
const galC = document.getElementById('gal'), starC = document.getElementById('stars');
const gx = galC.getContext('2d'), sx = starC.getContext('2d');
let W, H, stars = [], photo = null;
const photoImg = new Image();
photoImg.onload = () => { photo = photoImg; drawGal(); };
photoImg.src = 'andromeda.jpg';

function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [galC, starC].forEach(c => { c.width = W * d; c.height = H * d; });
  gx.setTransform(d, 0, 0, d, 0, 0); sx.setTransform(d, 0, 0, d, 0, 0);
  stars = Array.from({ length: Math.round(W * H / 2400) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + .25, p: Math.random() * 6.3, s: .4 + Math.random() * 1.4
  }));
  drawGal();
}

function drawGal() {
  const g = gx;
  g.clearRect(0, 0, W, H);
  if (photo) {
    const s = Math.max(W / photo.width, H / photo.height), w = photo.width * s, h = photo.height * s;
    g.drawImage(photo, (W - w) / 2, (H - h) / 2, w, h);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, H);
    return;
  }
  const bg = g.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H));
  bg.addColorStop(0, '#111427'); bg.addColorStop(1, '#03040a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  const R = Math.max(W, H) * .4, cx = W / 2, cy = H * .45, t = -.62, k = .36;
  const pos = (r, th) => {
    const x = r * Math.cos(th), y = r * Math.sin(th) * k;
    return [cx + x * Math.cos(t) - y * Math.sin(t), cy + x * Math.sin(t) + y * Math.cos(t)];
  };
  // ореол
  g.save(); g.translate(cx, cy); g.rotate(t); g.scale(1, k);
  const halo = g.createRadialGradient(0, 0, 0, 0, 0, R);
  halo.addColorStop(0, 'rgba(255,238,205,.5)'); halo.addColorStop(.1, 'rgba(255,215,165,.25)');
  halo.addColorStop(.5, 'rgba(140,160,230,.08)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(0, 0, R, 0, 6.3); g.fill(); g.restore();
  // звёздный диск с рукавами
  for (let i = 0; i < 3200; i++) {
    const u = Math.random(), r = R * Math.pow(u, 1.5) * .95, inner = r / R;
    const th = u < .25 ? Math.random() * 6.3
      : (Math.random() < .5 ? 0 : Math.PI) + 2.7 * Math.log(1 + r / (R * .07)) + (Math.random() + Math.random() + Math.random() - 1.5) * .5;
    const [x, y] = pos(r, th);
    const c = inner < .3 ? '255,228,185' : Math.random() < .1 ? '255,165,185' : '170,195,255';
    g.fillStyle = `rgba(${c},${(.15 + Math.random() * .5) * (1 - inner * .5)})`;
    const s = .4 + Math.random() * 1.2; g.fillRect(x, y, s, s);
  }
  // тёмные пылевые полосы
  g.fillStyle = 'rgba(2,3,10,.45)';
  for (let i = 0; i < 900; i++) {
    const r = R * (.25 + Math.random() * .6);
    const th = (Math.random() < .5 ? 0 : Math.PI) + 2.7 * Math.log(1 + r / (R * .07)) - .25 + (Math.random() - .5) * .18;
    const [x, y] = pos(r, th); g.fillRect(x, y, 2, 2);
  }
  // яркое ядро
  const core = g.createRadialGradient(cx, cy, 0, cx, cy, R * .12);
  core.addColorStop(0, 'rgba(255,252,240,1)'); core.addColorStop(.25, 'rgba(255,232,190,.85)'); core.addColorStop(1, 'rgba(255,210,150,0)');
  g.fillStyle = core; g.beginPath(); g.arc(cx, cy, R * .12, 0, 6.3); g.fill();
}

function loop(t) {
  sx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.y = (s.y + s.s * .03) % H;
    sx.fillStyle = `rgba(255,255,255,${.3 + .7 * (.5 + .5 * Math.sin(t * .001 * s.s + s.p))})`;
    sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.3); sx.fill();
  }
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
resize(); requestAnimationFrame(loop);

// Плеер: генеративный ambient «Star Drift» на Web Audio (без чужих файлов)
const btn = document.getElementById('play'), ip = document.getElementById('ip'), ipa = document.getElementById('ipa');
const bars = [...document.querySelectorAll('#eq span')], BIN = [1, 2, 4, 7, 11];
const CHORDS = [[110, 130.81, 164.81, 196], [87.31, 130.81, 164.81, 220], [130.81, 164.81, 196, 246.94], [98, 123.47, 146.83, 164.81]];
const SCALE = [440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
let ac, master, analyser, buf, bus, fx, pads = [], timers = [], ci = 0, on = false, raf = 0;

function build() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain();
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700;
  master = ac.createGain(); master.gain.value = 0;
  analyser = ac.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.frequencyBinCount);
  bus.connect(lp); lp.connect(master); master.connect(analyser); analyser.connect(ac.destination);
  fx = ac.createDelay(2); fx.delayTime.value = .42;            // эхо для «звёздных» нот
  const fb = ac.createGain(); fb.gain.value = .45;
  fx.connect(fb); fb.connect(fx); fx.connect(bus);
  pads = CHORDS[0].map(f => [0, 6].map(det => {                // два осциллятора на голос
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = det ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = det; g.gain.value = .05;
    o.connect(g); g.connect(bus); o.start(); return o;
  }));
}

function chord() {
  ci = (ci + 1) % CHORDS.length;
  pads.forEach((v, i) => v.forEach(o => o.frequency.setTargetAtTime(CHORDS[ci][i], ac.currentTime, 1.8)));
}

function spark() {
  if (Math.random() < .5) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = SCALE[(Math.random() * SCALE.length) | 0];
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.07, t + .04);
  g.gain.exponentialRampToValueAtTime(.0001, t + 3);
  o.connect(g); g.connect(bus); g.connect(fx);
  o.start(t); o.stop(t + 3.1);
}

function eq() {
  raf = 0;
  if (!on) { bars.forEach(b => b.style.height = '4px'); return; }
  analyser.getByteFrequencyData(buf);
  bars.forEach((b, i) => b.style.height = 4 + Math.min(1, buf[BIN[i]] / 110) * 20 + 'px');
  raf = requestAnimationFrame(eq);
}

btn.onclick = () => {
  if (!ac) build();
  on = !on;
  if (on) {
    ac.resume();
    master.gain.setTargetAtTime(.7, ac.currentTime, .6);
    timers = [setInterval(chord, 9000), setInterval(spark, 1300)];
    if (!raf) raf = requestAnimationFrame(eq);
  } else {
    master.gain.setTargetAtTime(0, ac.currentTime, .25);
    timers.forEach(clearInterval);
    setTimeout(() => { if (!on) ac.suspend(); }, 900);
  }
  ip.classList.toggle('hidden', on); ipa.classList.toggle('hidden', !on);
  btn.setAttribute('aria-label', on ? 'Пауза' : 'Воспроизвести');
};
